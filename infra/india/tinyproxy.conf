# Прокси к Meta. Слушает только петлю: снаружи он недоступен в принципе,
# обратный туннель приходит на этот же интерфейс.
User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
Timeout 600
LogLevel Warning
PidFile "/run/tinyproxy/tinyproxy.pid"
MaxClients 50
Allow 127.0.0.1
# Запросы к Meta идут по HTTPS, то есть методом CONNECT на 443.
ConnectPort 443
DisableViaHeader Yes
