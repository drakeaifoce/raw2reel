# Приложения живут отдельным compose-проектом от инфраструктуры (caddy, gitea,
# runner): так деплой приложения не может задеть CI, который его выполняет.
# Сеть создана инфраструктурным проектом, здесь она внешняя.

name: raw2reel-apps

networks:
  edge:
    external: true
    name: raw2reel_edge

services:
  frontend:
    image: raw2reel/frontend:${FRONTEND_TAG:?нужен FRONTEND_TAG}
    restart: unless-stopped
    networks: [edge]
    mem_limit: 128m

  backend:
    image: raw2reel/backend:${BACKEND_TAG:?нужен BACKEND_TAG}
    restart: unless-stopped
    # Переменные разнесены по сервисам: общий файл плюс свой. Ключ Meta лежит
    # только в ai.env — бэкенду он не нужен, и видеть его он не должен.
    env_file:
      - /opt/raw2reel/secrets/app.env
      - /opt/raw2reel/secrets/backend.env
    depends_on:
      nats:
        condition: service_healthy
    networks: [edge]
    mem_limit: 384m

  ai:
    image: raw2reel/ai:${AI_TAG:?нужен AI_TAG}
    restart: unless-stopped
    env_file:
      - /opt/raw2reel/secrets/app.env
      - /opt/raw2reel/secrets/ai.env
    networks: [edge]
    # Рендер гоняет ffmpeg, и это самый жадный до памяти сервис
    mem_limit: 640m

  # Воркер рендера: тот же образ, что у бэкенда, но другая команда. Отдельный
  # процесс потому, что рендер занимает минуты и делить его с HTTP-сервером
  # незачем. Один экземпляр: в AI-сервисе глобальный render_lock, второй слот
  # всё равно не появится.
  #
  # HTTP-порта у него нет, поэтому deploy.sh его готовность не проверяет —
  # смотреть docker compose logs worker.
  worker:
    image: raw2reel/backend:${BACKEND_TAG:?нужен BACKEND_TAG}
    restart: unless-stopped
    command: ["bun", "src/worker.ts"]
    # Образ бэкенда несёт HEALTHCHECK на порт 3000, а воркер ничего не слушает —
    # без отключения он навсегда остаётся unhealthy.
    healthcheck:
      disable: true
    env_file:
      - /opt/raw2reel/secrets/app.env
      - /opt/raw2reel/secrets/backend.env
    depends_on:
      nats:
        condition: service_healthy
    networks: [edge]
    # Результат рендера буферизуется в памяти перед записью в Blob: это готовый
    # рилс до 30 секунд, единицы мегабайт. Исходник в память не попадает.
    mem_limit: 512m

  # Очередь задач рендера. JetStream нужен именно персистентный: задача живёт
  # минуты, и терять её при перезапуске нельзя. Наружу не публикуется — только
  # внутренняя сеть.
  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command:
      - "-js"
      - "--store_dir=/data"
      - "--http_port=8222"
    volumes:
      - nats-data:/data
    networks: [edge]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nats-data:
