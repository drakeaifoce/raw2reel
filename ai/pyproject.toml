[project]
name = "raw2reel-ai"
version = "0.0.0"
description = "Облачный пайплайн эдитов: SAM, Muse Spark, Voice и FFmpeg"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "httpx>=0.28",
    "pillow>=11.0",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20,<0.1",
    "structlog>=25.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raw2reel_ai"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003 считают кириллицу обманчиво похожей на латиницу и срабатывают на
# каждом русском комментарии. Комментарии на русском здесь осознанны.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
